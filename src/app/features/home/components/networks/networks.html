<section class="bg-dpardo-smoke py-64 md:py-96" aria-labelledby="networks-title">
  <div class="mx-auto w-full max-w-[1280px] px-24 md:px-40 lg:px-64">
    <header class="mb-40">
      <p class="mb-12 text-[12px] font-bold tracking-[0.16em] text-dpardo-navy uppercase">Conexiones</p>
      <h2 id="networks-title" class="font-dpardo-display text-[clamp(40px,6vw,72px)] leading-[0.9] font-bold">Mis redes</h2>
    </header>
    <div class="grid grid-cols-1 gap-24 sm:grid-cols-2 lg:grid-cols-[repeat(auto-fit,minmax(240px,1fr))]">
      @for (network of networks(); track network.name) {
        <a [href]="network.link" target="_blank" rel="noopener noreferrer" class="group block h-full rounded-[8px] focus-visible:outline-2 focus-visible:outline-offset-[3px] focus-visible:outline-dpardo-race-blue">
          <app-card>
            <div class="flex flex-col items-start">
              <img
                src="images/networks/{{ network.image }}"
                alt=""
                width="34"
                height="34"
                class="h-34 w-34"
              />
              <span class="mt-24 h-4 w-40 bg-dpardo-race-blue" aria-hidden="true"></span>
              <h3 class="mt-16 text-[20px] leading-[1.4] font-bold">{{ network.name }}</h3>
              <p class="mt-8 text-[16px] leading-[1.6] text-dpardo-navy">{{ network.user }}</p>
            </div>
          </app-card>
        </a>
      }
    </div>
  </div>
</section>
